services:
  - type: web
    name: api-planejamento-estudos
    runtime: docker
    plan: free
    healthCheckPath: /estudantes
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: planejamento-estudos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: planejamento-estudos-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: planejamento-estudos-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: planejamento-estudos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: planejamento-estudos-db
          property: password

databases:
  - name: planejamento-estudos-db
    plan: free
    databaseName: planejamento_estudos
    user: estudos
