spring.application.name=api-planejamento-estudos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/planejamento_estudos}
spring.datasource.username=${DB_USER:estudos}
spring.datasource.password=${DB_PASSWORD:estudos_local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8081
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true